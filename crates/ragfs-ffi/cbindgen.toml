# cbindgen configuration for ragfs-ffi
# Generates C header from Rust FFI definitions
#
# We export only the #[no_mangle] extern "C" entry points. The opaque
# FsHandle type stays opaque (void*) in the C header — consumers don't
# touch its fields.

language = "C"
include_guard = "RAGFS_FFI_H"
autogen_warning = "/* Auto-generated by cbindgen. Do not edit manually. */"
no_includes = true
sys_includes = ["stdint.h"]

[export]
include = []

[export.rename]

[parse]
parse_deps = false

[fn]
rename_args = "None"
prefix = ""
