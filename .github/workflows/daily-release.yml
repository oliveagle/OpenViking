# daily-release.yml — Daily upstream sync + build + release
#
# What it does (once a day, or on demand):
#   1. sync   : fetch the upstream (fork parent) `main`, merge --no-ff into
#               the sync branch, push the merge commit
#   2. release: call release-binaries.yml (workflow_call) which builds the
#               selected components and publishes a GitHub Release whose
#               version is the SHORT GIT HASH of the new HEAD
#               (tag d@<hash>, name "OpenViking <hash>")
#
# Trigger modes:
#   - schedule (02:00 Asia/Shanghai)          — only on non-fork repos
#   - workflow_dispatch (component input)     — UI / `gh workflow run`
#   - push of a daily* tag                    — works on forks, no index lag:
#       daily@<ts>      full release (cli + lib)
#       daily-lib@<ts>  lib only
#       daily-cli@<ts>  cli only
#     (push events load the workflow file from the pushed ref itself, so
#      this is the reliable way to run it while the repo is a fork —
#      see scripts/daily-local.sh)
#
# Configuration (repo Settings → Variables and secrets → Variables):
#   DAILY_SYNC_BRANCH      branch to sync & release from
#                          (default: feat/cross-platform-release-binaries)
#   DAILY_UPSTREAM_BRANCH  upstream branch to merge (default: main)
#   DAILY_UPSTREAM_URL     upstream git URL (default: auto-detected fork
#                          parent, i.e. https://github.com/volcengine/OpenViking.git)
#
# NOTE (forks): GitHub does NOT run `schedule` triggers on forked repos.
# While this repo is a fork, drive the daily run from a local cron:
#
#   0 2 * * * cd <repo> && scripts/daily-local.sh
#
# (or trigger manually with `gh workflow run daily-release.yml --ref <branch>`).
# Once the repo is standalone or merged upstream, the schedule below takes
# over automatically.
#
# If the upstream merge conflicts, the sync job fails and no release is
# published that day — resolve the conflict on the sync branch and re-run.
#
# Pushing changes to .github/workflows/** from CI: GITHUB_TOKEN cannot do
# this (the `workflows` permission is not grantable to push/schedule-
# triggered workflows). Two ways to handle upstream workflow updates:
#   - set repo secret DAILY_PUSH_TOKEN (classic PAT with repo scope): the
#     sync job pushes EVERYTHING, including workflow files
#   - otherwise: workflow files are kept at their pre-merge state so the
#     push is allowed; upstream workflow updates are deferred (a NOTE is
#     printed) — sync them manually when convenient.

name: Daily Sync & Release

on:
  schedule:
    - cron: '0 18 * * *'  # 02:00 Asia/Shanghai (UTC+8)
  workflow_dispatch:
    inputs:
      component:
        description: 'Which component to build: all (cli + lib), cli, or lib'
        required: true
        type: choice
        options:
          - all
          - cli
          - lib
        default: all
  push:
    tags:
      - 'daily*'

permissions:
  contents: write

concurrency:
  group: daily-release
  cancel-in-progress: false

env:
  SYNC_BRANCH: ${{ vars.DAILY_SYNC_BRANCH || 'feat/cross-platform-release-binaries' }}
  UPSTREAM_BRANCH: ${{ vars.DAILY_UPSTREAM_BRANCH || 'main' }}

jobs:
  # ─── Sync upstream ──────────────────────────────────────────────────────────
  sync:
    name: Sync upstream
    runs-on: ubuntu-24.04
    env:
      DAILY_PUSH_TOKEN: ${{ secrets.DAILY_PUSH_TOKEN }}
    outputs:
      sha: ${{ steps.info.outputs.sha }}
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SYNC_BRANCH }}
          fetch-depth: 0

      - name: Resolve upstream remote
        id: up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="${{ vars.DAILY_UPSTREAM_URL || '' }}"
          if [[ -z "$URL" ]]; then
            PARENT="$(gh api "repos/${{ github.repository }}" --jq '.parent.full_name // empty')"
            [[ -n "$PARENT" ]] && URL="https://github.com/$PARENT.git"
          fi
          if [[ -z "$URL" ]]; then
            echo "No upstream (not a fork, DAILY_UPSTREAM_URL unset); skipping sync."
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          git remote add upstream "$URL"
          git fetch --no-tags upstream "${{ env.UPSTREAM_BRANCH }}"
          echo "upstream/${{ env.UPSTREAM_BRANCH }}: $(git rev-parse --short "upstream/${{ env.UPSTREAM_BRANCH }}")"

      - name: Merge upstream
        id: merge
        if: steps.up.outputs.url != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          UP="upstream/${{ env.UPSTREAM_BRANCH }}"
          if git merge-base --is-ancestor "$UP" HEAD; then
            echo "Already up to date with $UP"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            BASE=$(git rev-parse HEAD)
            git merge --no-ff "$UP" -m "chore(daily): sync $UP $(git rev-parse --short "$UP")"
            if [[ -n "$DAILY_PUSH_TOKEN" ]]; then
              # PAT push: allowed to include .github/workflows/** changes
              ORIGIN_URL=$(git remote get-url origin | sed -E 's#^git@github.com:#https://#')
              git push "https://x-access-token:${DAILY_PUSH_TOKEN}@${ORIGIN_URL#https://}" "HEAD:refs/heads/$SYNC_BRANCH"
            else
              # GITHUB_TOKEN push: must not touch .github/workflows/**
              if git diff --name-only "$BASE" HEAD -- .github/workflows/ | grep -q .; then
                # full reset of the path to pre-merge state (git checkout alone
                # would keep files that upstream ADDED under .github/workflows)
                git rm -r -q .github/workflows
                git checkout "$BASE" -- .github/workflows
                git commit --amend --no-edit
                echo "NOTE: upstream changed .github/workflows/**; kept pre-merge workflow files so the push is allowed."
                echo "      Set the DAILY_PUSH_TOKEN repo secret (classic PAT, repo scope) to auto-sync workflow files too."
              fi
              git push origin "HEAD:refs/heads/$SYNC_BRANCH"
            fi
            echo "Synced, new HEAD: $(git rev-parse --short HEAD)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report SHA
        id: info
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ─── Build & release (hash version, d@<hash> tag) ──────────────────────────
  release:
    name: Build & Release
    needs: sync
    uses: ./.github/workflows/release-binaries.yml
    with:
      # component: dispatch input wins; else derived from the daily* tag
      # prefix (daily-lib@.. / daily-cli@..); else all.
      component: ${{ inputs.component || (startsWith(github.ref_name, 'daily-lib') && 'lib') || (startsWith(github.ref_name, 'daily-cli') && 'cli') || 'all' }}
      sha: ${{ needs.sync.outputs.sha }}
