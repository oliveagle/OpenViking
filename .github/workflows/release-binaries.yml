# release-binaries.yml — Cross-platform binary release workflow
#
# Builds the following artifacts for all supported platforms:
#   - linux/amd64 (x86_64-unknown-linux-musl)
#   - linux/arm64 (aarch64-unknown-linux-musl)
#   - macos/amd64 (x86_64-apple-darwin)
#   - macos/arm64 (aarch64-apple-darwin)
#   - windows/amd64 (x86_64-pc-windows-msvc)
#   - windows/arm64 (aarch64-pc-windows-msvc)
#
# Artifacts per platform:
#   1. ov CLI binary (ov / ov.exe)
#   2. ragfs-ffi staticlib (libragfs_ffi.a / ragfs_ffi.lib) + C header
#      — embeddable into Go via cgo (see crates/ragfs-ffi/README.md)
#
# Artifacts are attached to GitHub Releases on tag push (v* or cli@*).
# Also supports manual workflow_dispatch for ad-hoc builds.
#
# Linux builds use musl for fully static binaries that run on any glibc
# distribution (CentOS 7/8, RHEL 8/9, Alpine, etc.).

name: Release Binaries

on:
  push:
    tags:
      - 'v*'
      - 'cli@*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g. 0.1.0). Leave empty for dev build.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Build matrix ────────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - name: linux-amd64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            ov_binary: ov
            ffi_lib: libragfs_ffi.a
            archive_ext: tar.gz

          - name: linux-arm64
            os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            ov_binary: ov
            ffi_lib: libragfs_ffi.a
            archive_ext: tar.gz

          # macOS
          - name: macos-amd64
            os: macos-15-intel
            target: x86_64-apple-darwin
            ov_binary: ov
            ffi_lib: libragfs_ffi.a
            archive_ext: tar.gz

          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            ov_binary: ov
            ffi_lib: libragfs_ffi.a
            archive_ext: tar.gz

          # Windows
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ov_binary: ov.exe
            ffi_lib: ragfs_ffi.lib
            archive_ext: zip

          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            ov_binary: ov.exe
            ffi_lib: ragfs_ffi.lib
            archive_ext: zip

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # ── Zig + cargo-zigbuild for Linux musl cross-compilation ──
      - name: Install Zig + cargo-zigbuild (Linux musl)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ZIG_VERSION=0.13.0
          ZIG_DIR="$RUNNER_TEMP/zig-$ZIG_VERSION"
          mkdir -p "$ZIG_DIR"
          curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/zig-linux-x86_64-$ZIG_VERSION.tar.xz" \
            | tar -xJ --strip-components=1 -C "$ZIG_DIR"
          echo "$ZIG_DIR" >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ "${GITHUB_REF}" == refs/tags/cli@* ]]; then
            VERSION="${GITHUB_REF#refs/tags/cli@}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      # ── Build ov CLI binary ──
      - name: Build ov CLI
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            cargo zigbuild --release --target ${{ matrix.target }} -p ov_cli
          else
            cargo build --release --target ${{ matrix.target }} -p ov_cli
          fi

      # ── Build ragfs-ffi staticlib (for Go cgo embedding) ──
      - name: Build ragfs-ffi staticlib
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            cargo zigbuild --release --target ${{ matrix.target }} -p ragfs-ffi
          else
            cargo build --release --target ${{ matrix.target }} -p ragfs-ffi
          fi

      # ── Package artifacts ──
      - name: Package release archive
        id: package
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STAGING="release-${{ matrix.name }}"
          mkdir -p "$STAGING/lib" "$STAGING/include"

          # Copy ov CLI binary
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp "target/${{ matrix.target }}/release/${{ matrix.ov_binary }}" "$STAGING/"
          else
            cp "target/${{ matrix.target }}/release/${{ matrix.ov_binary }}" "$STAGING/"
            chmod +x "$STAGING/${{ matrix.ov_binary }}"
          fi

          # Copy ragfs-ffi staticlib
          cp "target/${{ matrix.target }}/release/${{ matrix.ffi_lib }}" "$STAGING/lib/"

          # Copy C header
          cp "crates/ragfs-ffi/include/ragfs_ffi.h" "$STAGING/include/"

          # Copy README and LICENSE
          for f in README.md LICENSE; do
            [[ -f "$f" ]] && cp "$f" "$STAGING/"
          done

          # Create archive
          ARCHIVE="openviking-${VERSION}-${{ matrix.name }}.${{ matrix.archive_ext }}"
          if [[ "${{ matrix.archive_ext }}" == "zip" ]]; then
            cd "$STAGING" && 7z a "../$ARCHIVE" . && cd ..
          else
            tar -czf "$ARCHIVE" -C "$STAGING" .
          fi

          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "Archive: $ARCHIVE"
          ls -lh "$ARCHIVE"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ steps.package.outputs.archive }}

  # ─── Create GitHub Release ───────────────────────────────────────────────────
  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Display artifact structure
        run: ls -R artifacts/

      - name: Resolve version and tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ "${GITHUB_REF}" == refs/tags/cli@* ]]; then
            VERSION="${GITHUB_REF#refs/tags/cli@}"
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: OpenViking ${{ steps.tag.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Ad-hoc build (no release, just artifacts) ──────────────────────────────
  adhoc:
    name: Ad-hoc Build
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: Upload combined artifact
        uses: actions/upload-artifact@v7
        with:
          name: openviking-binaries
          path: artifacts/
