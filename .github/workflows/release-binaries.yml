# release-binaries.yml — Cross-platform binary release workflow
#
# Builds the following artifacts for all supported platforms:
#   - linux/amd64 (x86_64-unknown-linux-musl)
#   - linux/arm64 (aarch64-unknown-linux-musl)
#   - macos/amd64 (x86_64-apple-darwin)
#   - macos/arm64 (aarch64-apple-darwin)
#   - windows/amd64 (x86_64-pc-windows-msvc)
#
# Note: Windows is amd64-only (no arm64 builds).
#
# Artifacts per platform (two archives):
#   1. -cli  : ov CLI binary (ov / ov.exe)
#   2. -lib  : ragfs-ffi staticlib (lib/libragfs_ffi.a / lib/ragfs_ffi.lib)
#              + C header (include/ragfs_ffi.h) — embeddable into Go via
#              cgo (see docs/embedding-go.md)
#
# Artifacts are attached to GitHub Releases on tag push (v* or cli@*).
# Also supports manual workflow_dispatch for ad-hoc builds.
#
# Linux builds use musl for fully static binaries that run on any glibc
# distribution (CentOS 7/8, RHEL 8/9, Alpine, etc.).

name: Release Binaries

on:
  push:
    tags:
      - 'v*'
      - 'cli@*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g. 0.1.0). Leave empty for dev build.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Build matrix ────────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - name: linux-amd64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            ov_binary: ov
            ffi_lib: libragfs_ffi.a
            archive_ext: tar.gz

          - name: linux-arm64
            os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            ov_binary: ov
            ffi_lib: libragfs_ffi.a
            archive_ext: tar.gz

          # macOS
          - name: macos-amd64
            os: macos-15-intel
            target: x86_64-apple-darwin
            ov_binary: ov
            ffi_lib: libragfs_ffi.a
            archive_ext: tar.gz

          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            ov_binary: ov
            ffi_lib: libragfs_ffi.a
            archive_ext: tar.gz

          # Windows (amd64 only)
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ov_binary: ov.exe
            ffi_lib: ragfs_ffi.lib
            archive_ext: zip

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # ── Zig + cargo-zigbuild for Linux musl cross-compilation ──
      - name: Install Zig + cargo-zigbuild (Linux musl)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ZIG_VERSION=0.13.0
          ZIG_DIR="$RUNNER_TEMP/zig-$ZIG_VERSION"
          mkdir -p "$ZIG_DIR"
          curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/zig-linux-x86_64-$ZIG_VERSION.tar.xz" \
            | tar -xJ --strip-components=1 -C "$ZIG_DIR"
          echo "$ZIG_DIR" >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ "${GITHUB_REF}" == refs/tags/cli@* ]]; then
            VERSION="${GITHUB_REF#refs/tags/cli@}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      # ── Build ov CLI binary ──
      - name: Build ov CLI
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            cargo zigbuild --release --target ${{ matrix.target }} -p ov_cli
          else
            cargo build --release --target ${{ matrix.target }} -p ov_cli
          fi

      # ── Build ragfs-ffi staticlib (for Go cgo embedding) ──
      - name: Build ragfs-ffi staticlib
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            cargo zigbuild --release --target ${{ matrix.target }} -p ragfs-ffi
          else
            cargo build --release --target ${{ matrix.target }} -p ragfs-ffi
          fi

      # ── Package artifacts (CLI and lib ship as separate archives) ──
      - name: Package release archives
        id: package
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BASE="openviking-${VERSION}-${{ matrix.name }}"
          EXT="${{ matrix.archive_ext }}"

          # make_archive <staging-dir> <archive-name>: zip via 7z, else tar.gz.
          # Absolute target path so the 7z subshell (which cd's into staging)
          # still writes next to the repo root.
          make_archive() {
            local dir="$1"
            local name="$2"
            local abs="$PWD/$name"
            if [[ "$EXT" == "zip" ]]; then
              (cd "$dir" && 7z a -bso0 "$abs" . >/dev/null)
            else
              tar -czf "$abs" -C "$dir" .
            fi
          }

          # --- CLI archive: openviking-<ver>-<plat>-cli.{tar.gz,zip} ---
          STG_CLI="release-${{ matrix.name }}-cli"
          mkdir -p "$STG_CLI"
          cp "target/${{ matrix.target }}/release/${{ matrix.ov_binary }}" "$STG_CLI/"
          [[ "$EXT" != "zip" ]] && chmod +x "$STG_CLI/${{ matrix.ov_binary }}"
          for f in README.md LICENSE; do [[ -f "$f" ]] && cp "$f" "$STG_CLI/"; done
          make_archive "$STG_CLI" "$BASE-cli.$EXT"

          # --- LIB archive: openviking-<ver>-<plat>-lib.{tar.gz,zip} ---
          # ragfs-ffi staticlib (Go/cgo embedding) + C header. rustc emits
          # libragfs_ffi.a (ar) on unix and ragfs_ffi.lib (COFF) on msvc;
          # the matrix ffi_lib value matches the on-disk name.
          STG_LIB="release-${{ matrix.name }}-lib"
          mkdir -p "$STG_LIB/lib" "$STG_LIB/include"
          cp "target/${{ matrix.target }}/release/${{ matrix.ffi_lib }}" "$STG_LIB/lib/"
          cp "crates/ragfs-ffi/include/ragfs_ffi.h" "$STG_LIB/include/"
          for f in README.md LICENSE; do [[ -f "$f" ]] && cp "$f" "$STG_LIB/"; done
          make_archive "$STG_LIB" "$BASE-lib.$EXT"

          echo "archive_cli=$BASE-cli.$EXT" >> "$GITHUB_OUTPUT"
          echo "archive_lib=$BASE-lib.$EXT" >> "$GITHUB_OUTPUT"
          ls -lh "$BASE-cli.$EXT" "$BASE-lib.$EXT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            openviking-${{ steps.version.outputs.version }}-${{ matrix.name }}-cli.*
            openviking-${{ steps.version.outputs.version }}-${{ matrix.name }}-lib.*

  # ─── Create GitHub Release ───────────────────────────────────────────────────
  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Display artifact structure
        run: ls -R artifacts/

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          for f in */*; do
            [ -f "$f" ] || continue
            h="$(sha256sum "$f" | awk '{print $1}')"
            echo "$h  $(basename "$f")"
          done | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Resolve version and tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ "${GITHUB_REF}" == refs/tags/cli@* ]]; then
            VERSION="${GITHUB_REF#refs/tags/cli@}"
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: OpenViking ${{ steps.tag.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Ad-hoc build (no release, just artifacts) ──────────────────────────────
  adhoc:
    name: Ad-hoc Build
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: Upload combined artifact
        uses: actions/upload-artifact@v7
        with:
          name: openviking-binaries
          path: artifacts/
